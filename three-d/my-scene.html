<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>虚拟展馆</title>
    <script src="libs/aframe.min.js"></script>
</head>
<body>
    <a-scene>

        <!-- 环境-->
        <a-sky color="#000000"></a-sky>
        <a-plane
            position="0 0 -6" rotation="-90 0 0"
            width="30" height="30" color="#555555">
        </a-plane>

        <!-- 环境光+展厅顶光-->
        <a-light type="ambient" color="#ffffff" intensity="0.5"></a-light>
        <a-light type="point" position="0 5 -6" color="#ffffff" intensity="0.8"></a-light>

        <!-- ==================== 展台一：刀 ==================== -->
        <a-cylinder position="-3 0.3 -6" radius="0.8" height="0.6" color="#ffffff"></a-cylinder>
        <a-entity position="-3 1.6 -6" animation="property: rotation; to: 0 360 0; dur: 6000; loop: true; easing: linear">
        <!-- 刀身：-->
        <a-box position="0 0 0" width="0.12" height="1.4" depth="0.04" color="#cfd8dc"></a-box>
        <!-- 刀柄：-->
        <a-cylinder position="0 -0.95 0" radius="0.07" height="0.5" color="#5d4037"></a-cylinder>
        <!-- 护手：-->
        <a-box position="0 -0.65 0" width="0.3" height="0.06" depth="0.08" color="#8d6e63"></a-box>
    </a-entity>

        <!-- ==================== 展台二：剑 ==================== -->
        <a-cylinder position="0 0.3 -6" radius="0.8" height="0.6" color="#ffffff"></a-cylinder>
        <a-entity position="0 1.7 -6" animation="property: rotation; to: 0 360 0; dur: 6000; loop: true; easing: linear">
        <!-- 剑身-->
        <a-box position="0 0.1 0" width="0.1" height="1.6" depth="0.04" color="#e0e0e0"></a-box>
        <!-- 剑尖-->
        <a-cone position="0 1.05 0" radius-bottom="0.07" radius-top="0" height="0.3" color="#e0e0e0"></a-cone>
        <!-- 护手-->
        <a-box position="0 -0.7 0" width="0.45" height="0.08" depth="0.1" color="#ffb300"></a-box>
        <!-- 剑柄-->
        <a-cylinder position="0 -1.0 0" radius="0.06" height="0.5" color="#4e342e"></a-cylinder>
        <!-- 剑首-->
        <a-sphere position="0 -1.3 0" radius="0.08" color="#ffb300"></a-sphere>
        </a-entity>

        <!-- ==================== 展台三：长枪 ==================== -->
        <a-cylinder position="3 0.3 -6" radius="0.8" height="0.6" color="#ffffff"></a-cylinder>
        <a-entity position="3 1.9 -6" animation="property: rotation; to: 0 360 0; dur: 6000; loop: true; easing: linear">
        <!-- 枪杆-->
        <a-cylinder position="0 0 0" radius="0.05" height="2.6" color="#8d6e63"></a-cylinder>
        <!-- 枪头-->
        <a-cone position="0 1.5 0" radius-bottom="0.08" radius-top="0" height="0.45" color="#b0bec5"></a-cone>
        <!-- 红缨-->
        <a-cylinder position="0 1.25 0" radius="0.09" height="0.2" color="#e53935"></a-cylinder>
        </a-entity>
        
        <!-- 相机初始位-->
        <a-camera position="0 1.6 0" look-controls="enabled: true" wasd-controls="enabled: true"></a-camera>

    </a-scene>
</body>
</html>
