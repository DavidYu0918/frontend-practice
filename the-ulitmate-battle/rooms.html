<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>校园自习室信息中心 - 自习室</title>

    <link href="libs/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>

    <!-- 导航栏 -->
    <nav class="navbar navbar-dark bg-primary px-3">
        <span class="navbar-brand">校园自习室信息中心</span>
        <div>
        <a href="index.html" class="text-white me-3">首页</a>
        <a href="rooms.html" class="text-white me-3">自习室</a>
        <a href="statistics.html" class="text-white">数据统计</a>
        </div>
    </nav>

    <div id="globalAlert" class="alert alert-danger d-none text-center mb-0"></div>

    <div class="container mt-4">
        <h2>自习室查询</h2>
    </div>

    <div class="container mt-3">
        <div class="row">
        <div class="col-12 col-md-4 mb-2">
            <label class="form-label">楼层</label>
            <select id="filterFloor" class="form-select">
            <option value="">全部</option>
            </select>
        </div>
        <div class="col-12 col-md-4 mb-2">
            <label class="form-label">状态</label>
            <select id="filterStatus" class="form-select">
            <option value="">全部</option>
            <option value="开放">开放</option>
            <option value="关闭">关闭</option>
            </select>
        </div>
        <div class="col-12 col-md-4 mb-2">
            <label class="form-label">搜索名称</label>
            <input type="text" id="searchName" class="form-control" placeholder="输入关键字">
        </div>
        </div>
    </div>

    <div class="container mt-3 mb-5">
        <table class="table table-bordered">
        <thead class="table-primary">
            <tr>
            <th>名称</th>
            <th>楼层</th>
            <th>状态</th>
            <th>开放时间</th>
            </tr>
        </thead>
        <tbody id="roomTableBody">
            <tr><td colspan="4" class="text-center text-muted">加载中...</td></tr>
        </tbody>
        </table>

        <div id="emptyState" class="alert alert-warning d-none">没有找到匹配的自习室</div>
    </div>

    <footer class="bg-dark text-white text-center py-3">
        校园自习室信息中心 · 期末大作业
    </footer>

  <script src="libs/jquery-3.7.1.min.js"></script>
  <script src="libs/bootstrap.bundle.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/rooms.js"></script>
</body>
</html>
