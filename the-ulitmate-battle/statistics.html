<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>校园自习室信息中心 - 数据统计</title>

    <link href="libs/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>

    <!-- 导航栏 -->
    <nav class="navbar navbar-dark bg-primary px-3">
        <span class="navbar-brand">校园自习室信息中心</span>
        <div>
        <a href="index.html" class="text-white me-3">首页</a>
        <a href="rooms.html" class="text-white me-3">自习室</a>
        <a href="statistics.html" class="text-white">数据统计</a>
        </div>
    </nav>

    <div id="globalAlert" class="alert alert-danger d-none text-center mb-0"></div>

    <div class="container mt-4">
        <h2>数据统计</h2>
        <p class="text-muted">数据来源·展示使用</p>
    </div>

    <!-- 图表 -->
    <div class="container mt-3">
        <div class="row">
        <div class="col-12 col-md-6 mb-4">
            <div class="card">
            <div class="card-header">各楼层今日人次</div>
            <div class="card-body">
                <div id="barChart" style="width:100%; height:300px;"></div>
            </div>
            </div>
        </div>
        <div class="col-12 col-md-6 mb-4">
            <div class="card">
            <div class="card-header">一周使用人数趋势</div>
            <div class="card-body">
                <div id="lineChart" style="width:100%; height:300px;"></div>
            </div>
            </div>
        </div>
        </div>
    </div>

    <!-- 三维入口 -->
    <div class="container mt-3 mb-5">
        <div class="card">
            <div class="card-body d-flex justify-content-between align-items-center">
                <div>
                    <h5 class="mb-1">三维座位分布</h5>
                    <p class="text-muted mb-0">看看每个座位的占用情况。</p>
                </div>
                <a href="three-d.html" class="btn btn-primary" target="_blank">进入三维视图</a>
            </div>
        </div>
    </div>

    <footer class="bg-dark text-white text-center py-3">
        校园自习室信息中心 · 期末大作业
    </footer>

    <script src="libs/jquery-3.7.1.min.js"></script>
    <script src="libs/bootstrap.bundle.min.js"></script>
    <script src="libs/echarts.min.js"></script>
    <script src="js/common.js"></script>
    <script src="js/statistics.js"></script>
</body>
</html>
