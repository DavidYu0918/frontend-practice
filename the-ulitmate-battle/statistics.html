<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>校园自习室信息中心 - 数据统计</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- 导航栏 -->
    <nav class="navbar navbar-dark bg-primary px-3">
        <span class="navbar-brand">校园自习室信息中心</span>
        <div>
        <a href="index.html" class="text-white me-3">首页</a>
        <a href="rooms.html" class="text-white me-3">自习室</a>
        <a href="statistics.html" class="text-white">数据统计</a>
        </div>
    </nav>

    <div id="globalAlert" class="alert alert-danger d-none text-center mb-0"></div>

    <div class="container mt-4">
        <h2>数据统计</h2>
    </div>

    <!-- 图表 -->
    <div class="container mt-3">
        <div class="row">
        <div class="col-12 col-md-6 mb-4">
            <div class="card">
            <div class="card-header">各楼栋自习室数量</div>
            <div class="card-body">
                <div id="barChart" style="width:100%; height:300px;"></div>
            </div>
            </div>
        </div>
        <div class="col-12 col-md-6 mb-4">
            <div class="card">
            <div class="card-header">一周使用人数趋势</div>
            <div class="card-body">
                <div id="lineChart" style="width:100%; height:300px;"></div>
            </div>
            </div>
        </div>
        </div>
    </div>

    <!-- 三维展示 -->
    <div class="container mt-3 mb-5">
        <h4>三维座位分布</h4>
        <p class="text-muted">用鼠标拖动可以旋转，滚轮可以缩放。绿色是空闲，红色是占用。</p>
        <div id="threeContainer" style="width:100%; height:400px; border:1px solid #ddd;"></div>
    </div>

    <footer class="bg-dark text-white text-center py-3">
        校园自习室信息中心 · 期末大作业
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script src="js/common.js"></script>
    <script src="js/stats.js"></script>
</body>
</html>
