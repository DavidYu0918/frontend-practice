<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>校园生活数据看板</title>
    <link href="libs/bootstrap.min.css" rel="stylesheet">
    <style>
        .chart-box {height:360px; }
        #status {display:none; }
        .card-active {border: 2px solid #0d6efd; box-shadow: 0 0 8px rgba(13, 110, 253, 0.4);}
    </style>
</head>
<body class="container py-4">
    <header class="mb-4">
        <h1 class="h3">校园生活数据看板</h1>
        <p class="text-muted" id="sub-title">数据来源：演示使用</p>
    </header>

    <p id="status" class="alert alert-warning"></p>

    <section class="row g-3 mb-4" id="cards"></section>
    
    <section class="row g-3 mb-4">
        <div class="col-lg-6">
            <h2 class="h5">各学院各月活动参与量（ECharts柱状图）</h2>
            <div id="bar-chart" class="chart-box"></div>
        </div>

        <div class="col-lg-6">
            <h2 class="h5">活动参与趋势（Chart.js折线图）</h2>
            <div class="chart-box"><canvas id="line-chart"></canvas></div>
        </div>
    </section>

    <section class="row g-3 mb-4">
        <div class="col-12">
            <h2 class="h5">各学院总参与量占比（ECharts饼图）</h2>
            <div id="pie-chart" class="chart-box"></div>
        </div>
    </section>

    <script src="libs/jquery-3.7.1.min.js"></script>
    <script src="libs/bootstrap.bundle.min.js"></script>
    <script src="libs/echarts.min.js"></script>
    <script src="libs/chart.umd.js"></script>
    <script src="app.js"></script>
</body>
</html>
