<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>图书借阅登记</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>图书借阅登记</h1>
    <p>感谢支持我们的工作</p>
  </header>
  <nav>
    <a href="#intro">填写说明</a>
    <a href="#form">开始登记</a>
  </nav>
  <main>
    <section id="intro">
      <h2>填写说明</h2>
      <p>方便图书管理，有借有还，再借不难。</p>
    </section>
    <section id="form">
      <h2>登记信息</h2>
    </section>

    <form action="#" method="get">
  <p>
    <label for="name">姓名： </label>
    <input type="text" id="name" name="name" placeholder="请输入你的名字" required>
  </p>
  <p>
    <label for="phone">联系电话： </label>
    <input type="tel" id="phone" name="phone" placeholder="请输入电话号码" pattern="[0-9]{11}" required>
  </p>
  <p>借阅时间</p>
  <p>
    <label for="date">日期： </label>
    <input type="date" id="date" name="date" required>
  </p>
  <p>归还时间</p>
  <p>
    <label><input type="radio" name="deadline" value="一个月之内">一个月之内</label>
    <label><input type="radio" name="deadline" value="一周之内">一周之内</label>
  </p>
  <p>是否有什么建议？</p>
  <p>
    <label for="advice">具体建议</label><br>
    <textarea id="advice" name="advice" rows="4" maxlength="200" placeholder="请给予我们宝贵的建议"></textarea>
  </p>
  <p>
    <button type="submit">登记完成</button>
  </p>
</form>

  </main>
  <footer>
    <p>自主实践任务</p>
  </footer>
</body>
</html>
